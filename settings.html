<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travels Portal - Admin Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24">

    <header class="bg-slate-900 text-white p-5 shadow-md sticky top-0 z-50 border-b-4 border-yellow-500">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row gap-4 justify-between items-center">
            <div>
                <h1 class="text-xl font-black tracking-tight uppercase">Fleet Admin Console</h1>
                <p class="text-xs text-yellow-400 font-bold">Manage Fleet Nodes, Packages & Interstitials</p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700">
                    <label for="taxi-select" class="text-xs font-bold uppercase tracking-wider text-slate-400">Select Unit:</label>
                    <select id="taxi-select" class="bg-slate-900 text-yellow-400 font-mono font-bold text-xs p-1 rounded outline-none border border-slate-600 focus:border-yellow-400">
                        <option value="taxi1">Taxi Node 1 (taxi1)</option>
                        <option value="taxi2">Taxi Node 2 (taxi2)</option>
                        <option value="taxi3">Taxi Node 3 (taxi3)</option>
                        <option value="taxi4">Taxi Node 4 (taxi4)</option>
                        <option value="taxi5">Taxi Node 5 (taxi5)</option>
                    </select>
                </div>
                <span class="text-xs font-mono bg-slate-800 px-3 py-2 rounded-xl border border-slate-700 text-slate-300 hidden sm:inline-block">
                    Active ID: <span id="current-node-txt" class="text-white font-bold">...</span>
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-8 mt-4">

        <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <h2 class="text-lg font-black text-slate-900 uppercase tracking-tight mb-4 flex items-center gap-2">
                ⚙️ Profile & Fleet Settings
            </h2>
            <form id="settings-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Node Status</label>
                    <select id="set-status" class="w-full p-3 border rounded-xl font-bold bg-slate-50">
                        <option value="active">🟢 Active (Publicly Accessible)</option>
                        <option value="inactive">🚫 Inactive (Lockout Screen Enabled)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Travels Agency Title</label>
                    <input id="set-title" type="text" class="w-full p-3 border rounded-xl font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Primary Booking Phone (e.g. 9154095125)</label>
                    <input id="set-phone" type="tel" class="w-full p-3 border rounded-xl font-mono">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Driver Name</label>
                    <input id="set-driver-name" type="text" class="w-full p-3 border rounded-xl font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Driver Photo/Video Link (.mp4 / .webm / image url)</label>
                    <input id="set-driver-img" type="url" class="w-full p-3 border rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Vehicle Plate Number</label>
                    <input id="set-taxi-no" type="text" class="w-full p-3 border rounded-xl font-mono uppercase">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Vehicle Configuration / Type</label>
                    <input id="set-v-type" type="text" placeholder="e.g. Innova Crysta, Sedan" class="w-full p-3 border rounded-xl">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Seating Capacity</label>
                    <input id="set-v-capacity" type="text" placeholder="e.g. 6+1, 4+1" class="w-full p-3 border rounded-xl">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Vehicle Fleet Photo/Video Link (.mp4 / .webm / image url)</label>
                    <input id="set-taxi-img" type="url" class="w-full p-3 border rounded-xl text-sm">
                </div>
                <div class="md:col-span-2 pt-2">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition uppercase tracking-wider text-xs shadow-md">
                        Save Fleet Profile Settings Update 💾
                    </button>
                </div>
            </form>
        </section>

        <section class="bg-amber-50 rounded-2xl p-6 shadow-sm border border-amber-200">
            <h2 class="text-lg font-black text-amber-900 uppercase tracking-tight mb-1 flex items-center gap-2">
                📺 Manage Advertisement Interstitial
            </h2>
            <p class="text-xs text-amber-700 font-medium mb-4">Configure the promotional pop-up banner details that hit users before they access package data options.</p>
            
            <form id="ad-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-amber-800 uppercase mb-1">Countdown Window Timer (Seconds)</label>
                    <input id="ad-set-timer" type="number" min="1" max="60" class="w-full p-3 border-2 border-amber-200 rounded-xl font-bold bg-white">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-amber-800 uppercase mb-1">Ad Sub-Header Text Tag</label>
                    <input id="ad-set-tag" type="text" placeholder="e.g. Sponsored Announcement" class="w-full p-3 border-2 border-amber-200 rounded-xl font-medium bg-white">
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs font-bold text-amber-800 uppercase mb-1">Ad Competing Headline Title</label>
                    <input id="ad-set-headline" type="text" class="w-full p-3 border-2 border-amber-200 rounded-xl font-bold bg-white">
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs font-bold text-amber-800 uppercase mb-1">Ad Media URL (.mp4 / .webm video / banner image asset link)</label>
                    <input id="ad-set-media" type="url" class="w-full p-3 border-2 border-amber-200 rounded-xl text-sm bg-white">
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs font-bold text-amber-800 uppercase mb-1">Ad Body Context Blurb Copy</label>
                    <textarea id="ad-set-desc" rows="2" class="w-full p-3 border-2 border-amber-200 rounded-xl text-sm bg-white"></textarea>
                </div>
                <div class="md:col-span-3 pt-1">
                    <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-black py-3.5 rounded-xl transition uppercase tracking-wider text-xs shadow-md">
                        Update Portal Ad Campaign Live 🚀
                    </button>
                </div>
            </form>
        </section>

        <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <h2 class="text-lg font-black text-slate-900 uppercase tracking-tight mb-4 flex items-center gap-2">
                📦 Add New Tour Package Module
            </h2>
            <form id="package-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Package Name / Destination Route</label>
                        <input id="pkg-title" type="text" required class="w-full p-3 border rounded-xl font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Primary Cover Media URL (.mp4 / .webm / image url)</label>
                        <input id="pkg-img" type="url" required class="w-full p-3 border rounded-xl text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Package Description details</label>
                    <textarea id="pkg-desc" rows="3" required class="w-full p-3 border rounded-xl text-sm"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Internal Gallery Assets JSON List (Optional URL Array override)</label>
                    <input id="pkg-gallery" type="text" placeholder='["https://url1.jpg", "https://url2.mp4"]' class="w-full p-3 border rounded-xl text-xs font-mono">
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl transition uppercase tracking-wider text-xs shadow-md">
                    Deploy Package Module Option ➕
                </button>
            </form>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7omObD0cWgdqGsNq-8L7n9i_Akp_JCEM",
            authDomain: "master-web-app-d8d1b.firebaseapp.com",
            projectId: "master-web-app-d8d1b",
            databaseURL: "https://master-web-app-d8d1b-default-rtdb.firebaseio.com",
            appId: "1:460731698074:web:40ad4f12c5fb3126874823"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Initial Taxi node configuration setup
        const urlParams = new URLSearchParams(window.location.search);
        let TAXI_ID = urlParams.get('id') || 'taxi1';
        
        // Match drop down value to URL params or default settings
        const taxiSelect = document.getElementById('taxi-select');
        taxiSelect.value = TAXI_ID;
        document.getElementById('current-node-txt').innerText = TAXI_ID;

        // Firebase references holders for dynamic reassignment
        let settingsListener, adListener;

        // Master function to sync admin data inputs when selector modifications are made
        function setupDatabaseListeners(nodeId) {
            // Detach previous bindings if any exist to clean processor pipeline memory
            if(settingsListener) settingsListener();
            if(adListener) adListener();

            document.getElementById('current-node-txt').innerText = nodeId;

            // 1. Sync settings fields data
            settingsListener = onValue(ref(db, nodeId + '/settings'), (snap) => {
                const data = snap.val();
                if(data) {
                    document.getElementById('set-status').value = data.status || "active";
                    document.getElementById('set-title').value = data.title || "BHASKAR TRAVELS";
                    document.getElementById('set-phone').value = data.phone || "";
                    document.getElementById('set-driver-name').value = data.driverName || "";
                    document.getElementById('set-driver-img').value = data.driverImg || "";
                    document.getElementById('set-taxi-no').value = data.taxiNo || "";
                    document.getElementById('set-v-type').value = data.vehicleType || "";
                    document.getElementById('set-v-capacity').value = data.vehicleCapacity || "";
                    document.getElementById('set-taxi-img').value = data.taxiImg || "";
                } else {
                    // Reset to clean layouts if configuration object isn't present yet on specific node path
                    document.getElementById('settings-form').reset();
                }
            });

            // 2. Sync interstitial advertisement data keys
            adListener = onValue(ref(db, nodeId + '/advertisement'), (snap) => {
                const data = snap.val();
                if(data) {
                    document.getElementById('ad-set-timer').value = data.timerDuration || 5;
                    document.getElementById('ad-set-tag').value = data.sponsoredTag || "Sponsored Announcement";
                    document.getElementById('ad-set-headline').value = data.headline || "Premium Travel Services";
                    document.getElementById('ad-set-media').value = data.mediaUrl || "https://www.w3schools.com/html/mov_bbb.mp4";
                    document.getElementById('ad-set-desc').value = data.description || "";
                } else {
                    document.getElementById('ad-form').reset();
                }
            });
        }

        // Initialize bindings immediately for startup load state
        setupDatabaseListeners(TAXI_ID);

        // Bind drop-down action switcher to alter targeted target node updates live
        taxiSelect.addEventListener('change', (e) => {
            TAXI_ID = e.target.value;
            // Update URL search parameters container window safely without page refresh loop
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?id=' + TAXI_ID;
            window.history.pushState({ path: newUrl }, '', newUrl);
            
            setupDatabaseListeners(TAXI_ID);
        });

        // Form Submit: Process Settings Data Update Task
        document.getElementById('settings-form').onsubmit = (e) => {
            e.preventDefault();
            update(ref(db, TAXI_ID + '/settings'), {
                status: document.getElementById('set-status').value,
                title: document.getElementById('set-title').value,
                phone: document.getElementById('set-phone').value,
                driverName: document.getElementById('set-driver-name').value,
                driverImg: document.getElementById('set-driver-img').value,
                taxiNo: document.getElementById('set-taxi-no').value,
                vehicleType: document.getElementById('set-v-type').value,
                vehicleCapacity: document.getElementById('set-v-capacity').value,
                taxiImg: document.getElementById('set-taxi-img').value
            }).then(() => alert(`Profile properties for ${TAXI_ID} synchronized successfully!`)).catch(err => alert("Error saving: " + err.message));
        };

        // Form Submit: Process Advertisement Context Parameters Update Task
        document.getElementById('ad-form').onsubmit = (e) => {
            e.preventDefault();
            update(ref(db, TAXI_ID + '/advertisement'), {
                timerDuration: parseInt(document.getElementById('ad-set-timer').value) || 5,
                sponsoredTag: document.getElementById('ad-set-tag').value,
                headline: document.getElementById('ad-set-headline').value,
                mediaUrl: document.getElementById('ad-set-media').value,
                description: document.getElementById('ad-set-desc').value
            }).then(() => alert(`Advertisement properties for ${TAXI_ID} synchronized live!`)).catch(err => alert("Error saving ad block: " + err.message));
        };

        // Form Submit: Insert New Tour Package Block Task
        document.getElementById('package-form').onsubmit = (e) => {
            e.preventDefault();
            
            let parsedGallery = null;
            const galleryVal = document.getElementById('pkg-gallery').value.trim();
            if(galleryVal) {
                try {
                    parsedGallery = JSON.parse(galleryVal);
                } catch(err) {
                    alert("Invalid JSON format written into Gallery field.");
                    return;
                }
            }

            const newPackageData = {
                title: document.getElementById('pkg-title').value,
                img: document.getElementById('pkg-img').value,
                desc: document.getElementById('pkg-desc').value
            };
            if(parsedGallery) newPackageData.gallery = parsedGallery;

            push(ref(db, TAXI_ID + '/packages'), newPackageData).then(() => {
                alert(`New travel routing package module added to ${TAXI_ID} successfully!`);
                document.getElementById('package-form').reset();
            }).catch(err => alert("Error appending package: " + err.message));
        };
    </script>
</body>
</html>
